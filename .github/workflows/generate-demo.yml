name: Generate 25-person demo
# Runs the REAL pipeline (scrape -> analyze -> 300+ agent dates -> rankings) for data/seed.json
# and commits the cached result to data/demo.json. Needs repo secrets MISTRAL_API_KEY and APIFY_TOKEN.
on:
  workflow_dispatch:
    inputs:
      limit: { description: "Only the first N seed people (blank = all)", required: false, default: "" }
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Run pipeline
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: "6"
        run: npm run generate:demo
      - name: Commit demo data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/demo.json
          git commit -m "Update pre-run demo dataset" || echo "nothing to commit"
          git push
